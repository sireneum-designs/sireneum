<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sireneum — post editor</title>
  </head>
  <body>
    <!-- Decap CMS. Everything it does is a commit to
         github.com/sireneum-designs/sireneum on branch main; Netlify
         rebuilds the site when that commit lands. There is no database
         and no server of ours: sign-in is GitHub's, storage is the repo.

         Setup — the parts that cannot be done in code — is written up in
         ADMIN-SETUP.md at the root of the repo. Until that is done, this
         page will load and fail to log in, which is expected. -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
